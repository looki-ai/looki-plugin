name: Sync skills from looki-skills

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref from looki-ai/looki-skills to sync
        required: true
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out looki-plugin
        uses: actions/checkout@v4

      - name: Check out looki-skills
        uses: actions/checkout@v4
        with:
          repository: looki-ai/looki-skills
          ref: ${{ inputs.source_ref }}
          path: source-skills

      - name: Sync skills
        shell: bash
        run: |
          set -euo pipefail

          rm -rf skills
          mkdir skills
          cp -R source-skills/skills/. skills/
          rm -rf source-skills

          found=false
          for skill_dir in skills/*/; do
            [ -d "$skill_dir" ] || continue
            found=true
            [ -f "${skill_dir}SKILL.md" ] || {
              echo "Missing ${skill_dir}SKILL.md"
              exit 1
            }
          done

          if [ "$found" != true ]; then
            echo "No skills found after sync"
            exit 1
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/sync-looki-skills
          delete-branch: true
          commit-message: "feat(skills): sync from looki-skills"
          title: "feat(skills): sync from looki-skills"
          body: |
            ## Summary
            - sync bundled skills from `looki-ai/looki-skills`

            ## Source
            - ref: `${{ inputs.source_ref }}`

            This pull request was generated by the `sync-skills` workflow.
