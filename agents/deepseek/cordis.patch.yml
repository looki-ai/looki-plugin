- insert:
    - id: looki-plugin
      name: looki-plugin
      config:
        mcpUrl: https://open.looki.ai/mcp
        authSuccessUrl: https://web.looki.ai/oauth/success
    - id: looki-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      inject: [lookiPlugin]
      config:
        providerName: looki
        includeDefaultRoots: false
        bundledSkillDir: !!js ctx.lookiPlugin.skillsDir
        watch: false
